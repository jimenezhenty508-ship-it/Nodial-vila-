name: Compilar NoDial Avila

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: |
          unzip NoDial_Avila_para_compilar_desde_celular.zip -d source

      - name: Compilar APK
        run: gradle -p source assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NoDial-Avila-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
